#service #headless service #statefulset #pvc

#service
apiVersion: v1
kind: Service
metadata:
 name: rabbitmq
 namespace: roboshop
spec:
  selector:
   component: rabbitmq
   project: roboshop
  ports:
    - protocol: TCP
      port: 5672
      targetPort: 5672
---
# headless service
apiVersion: v1
kind: Service
metadata:
 name: rabbitmq-headless
 namespace: roboshop
spec:
  clusterIP: None
  selector:
   component: rabbitmq
   project: roboshop
  ports:
    - protocol: TCP
      port: 5672
      targetPort: 5672
---
#statefulset
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: roboshop
spec:
  replicas: 1
  selector:
    # these labels are used to select pods
    matchLabels:
      component: rabbitmq
      project: roboshop
  serviceName: "rabbitmq-headless"
  # pod definition
  template:
    metadata:
      labels:
        component: rabbitmq
        project: roboshop
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:3
        volumeMounts:
        - name: rabbitmq
          mountPath: /var/lib/rabbitmq
        env:
        - name: RABBITMQ_DEFAULT_USER
          value: roboshop
        - name: RABBITMQ_DEFAULT_PASS
          value: roboshop123
  # This is PVC
  volumeClaimTemplates:
  - metadata:
      name: rabbitmq
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "roboshop-ebs"
      resources:
        requests:
          storage: 1Gi