apiVersion: v1
kind: ConfigMap
metadata:
 name: shipping
 namespace: roboshop
data:
 CART_ENDPOINT: "cart:8080"
 DB_HOST: "mysql"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping
  namespace: roboshop
  # these are replica set labels
  labels:
    component: shipping
    project: roboshop
spec:
  replicas: 1
  selector:
    # these labels are used to select pods
    matchLabels:
      component: shipping
      project: roboshop
  # pod definition
  template:
    metadata:
      labels:
        component: shipping
        project: roboshop
    spec:
      containers:
      - name: shipping
        image: mahicharan/shipping:v1
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
            name: shipping
        ports:
        - name: liveness-port
          containerPort: 8080
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "400m"
        livenessProbe:
          httpGet:
            path: /health
            port: liveness-port
          failureThreshold: 3
          periodSeconds: 15
          initialDelaySeconds: 90
        readinessProbe:
          httpGet:
            path: /health
            port: liveness-port
          failureThreshold: 3
          periodSeconds: 10
          initialDelaySeconds: 60
---
#service
apiVersion: v1
kind: Service
metadata:
 name: shipping
 namespace: roboshop
spec:
  selector:
   component: shipping
   project: roboshop
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
---
#horizontal pod autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: shipping
  namespace: roboshop
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: shipping
  minReplicas: 1
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 5

 