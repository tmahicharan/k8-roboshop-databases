#service #headless service #statefulset #pvc

#service
apiVersion: v1
kind: Service
metadata:
 name: mongodb
 namespace: roboshop
spec:
  selector:
   component: mongodb
   project: roboshop
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017
---
# headless service
apiVersion: v1
kind: Service
metadata:
 name: mongodb-headless
 namespace: roboshop
spec:
  clusterIP: None
  selector:
   component: mongodb
   project: roboshop
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017
---
#statefulset
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: roboshop
spec:
  replicas: 2
  selector:
    matchLabels:
      component: mongodb
      project: roboshop
  serviceName: "mongodb-headless"
  template:
    metadata:
      labels:
        component: mongodb
        project: roboshop
    spec:
      containers:
      - name: mongodb
        image: mahicharan/mongodb:v1
        volumeMounts:
        - name: mongodb
          mountPath: /data/db
  volumeClaimTemplates:
  - metadata:
      name: mongodb
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "roboshop-ebs"
      resources:
        requests:
          storage: 1Gi